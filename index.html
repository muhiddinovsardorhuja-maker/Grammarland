<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammarland</title>

  <style>
    body{
      margin:0;
      padding:0;
      background:#0d0f1a;
      color:white;
      font-family:Arial,sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      text-align:center;
    }

    .box{
      background:#151825;
      padding:40px;
      border-radius:20px;
      width:90%;
      max-width:500px;
      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    h1{
      color:#5b7fff;
      margin-bottom:10px;
    }

    p{
      color:#b8bfd8;
      line-height:1.6;
    }

    button{
      margin-top:20px;
      padding:12px 24px;
      border:none;
      border-radius:10px;
      background:#5b7fff;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{
      opacity:0.9;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>📖 Grammarland AI</h1>

    <p>
      Ingliz tili grammatikasini oson o‘rganish uchun yaratilgan mini platforma.
    </p>

    <button onclick="showMessage()">
      Bosish
    </button>
  </div>

  <script>
    function showMessage(){
      alert("Grammarland AI ishlayapti ✅");
    }
  </script>

</body>
</html>
